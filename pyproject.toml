[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tikaz-token-forge"
version = "0.1.0"
description = "Dependency-rich local context compiler for Codex"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "TIKAZ" }]
dependencies = []

[project.scripts]
token-forge = "token_forge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

