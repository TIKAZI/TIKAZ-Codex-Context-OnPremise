[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tikaz-token-forge"
version = "0.2.0"
description = "Local-first multimodal context compiler for Codex with evidence-aware retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "TIKAZ" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/TIKAZI/TIKAZ-Codex-Context-OnPremise"
Documentation = "https://github.com/TIKAZI/TIKAZ-Codex-Context-OnPremise#readme"
Issues = "https://github.com/TIKAZI/TIKAZ-Codex-Context-OnPremise/issues"

[project.scripts]
token-forge = "token_forge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
token_forge = ["data/*.json"]

